        select,

        #top-bar-box {
            margin: 0 auto;
            max-width: 380px;
            min-width: 290px;
            height: 100%;
            padding: 0 20px;
            position: relative
        }

        #logo {
            position: absolute;
            left: 20px;
            bottom: 10px;
            color: #fff;
            display: flex;
            align-items: flex-end
        }

        #logo .main {
            font-family: AlibabaPuHuiTi-3-115-Black, sans-serif;
            font-size: 60px
        }

        #logo .english,
        #logo .main {
            align-self: flex-end;
            line-height: 1.1
        }

        #logo .english {
            font-family: Alibaba-PuHuiTi-Regular, sans-serif;
            font-size: 22px;
            margin-left: 3px;
            margin-bottom: 2px;
            opacity: .5
        }

        .content-box {
            margin: 0 auto;
            max-width: 380px;
            min-width: 290px;
            min-height: 50vh;
            padding: 40px 20px 20px
        }

        .content-box input {
            font-family: Monaco, PingFang SC, Lantinghei SC, Microsoft Yahei, Hiragino Sans GB, Microsoft Sans Serif, WenQuanYi Micro Hei, sans-serif;
            font-weight: 400;
            color: #666666;
            width: 100%;
            padding: 10px;
            border: 2px solid #ebf0f5;
            background-color: #ebf0f5;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease; /* 平滑过渡效果 */
            -webkit-appearance: none;
            appearance: none; /* 标准属性 */
        }

        .input-group {
            margin-bottom: 24px;
        }

        #password-input-area,
        #key-input-area {
            position: relative
        }

        #last-password {
            height: 48px;
            padding: 10px;
            background-color: #ebf0f5;
            border-radius: 4px;
            position: relative
        }

        #last-password button,
        #clear-password,
        #clear-key {
            border: none
        }

        #last-password .copy,
        #clear-password,
        #clear-key {
            background-color: #FB7299;
            color: #ffffff;
            height: 100%;
            width: 88px;
            padding: 10px 0;
            position: absolute;
            right: 0;
            top: 0;
            border-radius: 0 4px 4px 0;
            cursor: pointer
        }

        #last-password:hover .show-password {
            opacity: .8
        }

        #last-password .password {
            font-family: Monaco, consolas, monospace, sans-serif;
            font-weight: 400;
            color: #666
        }

        .show-password {
            cursor: pointer;
            padding: 0 3px;
            float: right;
            margin-right: 90px;
            background-color: transparent;
            opacity: .1;
            outline: none
        }

        .svg-icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: -.125em;
            background-repeat: no-repeat;
            background-size: 1em 1em;
            background-position: 50%
        }

        .icon-open-eye {
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 011.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0114.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 011.172 8z"/><path d="M8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM4.5 8a3.5 3.5 0 117 0 3.5 3.5 0 01-7 0z"/></svg>')

        }

        .hidden {
            display: none
        }

        #footer {
            text-align: center;
            font-size: 12px;
            color: #9299a4
        }

        #footer a.beian {
            color: #b0b8c4
        }

        #footer a.beian:hover {
            color: #646b75
        }

</head>

    <div id="top-bar">
        <div id="top-bar-box">

                    <p>Password</p>
                </div>
            </div>
            
        </div>

            </div>

        const DOM = {
            passwordInput: document.getElementById('password-input'),
            keyInput: document.getElementById('key-input'),
            passwordInputArea: document.getElementById('password-input-area'),
            keyInputArea: document.getElementById('key-input-area'),
            clearPassword: document.getElementById('clear-password'),
            clearKey: document.getElementById('clear-key'),
            lastPassword: document.getElementById('last-password'),
            generatedHash: document.getElementById('generated-hash'),
            copyButton: document.getElementById('copy-button'),
            showPasswordBtn: document.querySelector('.show-password'),
            topBar: document.getElementById('top-bar'),
            themeToggle: document.getElementById('theme-toggle')
        };

        // ==================== 状态管理 ====================
        let state = {
            clipboardText: '',
            isPinkTheme: true,
            themeStyleElement: null
        };

        // ==================== 工具函数 ====================
        const Utils = {
            replaceWithAsterisks: function(str) {
                if (str.length <= 6) return str;
                const front = str.slice(0, 3);
                const back = str.slice(-3);
                const middle = '*'.repeat(str.length - 6);
                return front + middle + back;
            },
            recordCharType: function(char, charSet, typesUsed) {
                if (charSet.upper.includes(char)) {
                    typesUsed.upper = true;
                } else if (charSet.lower.includes(char)) {
                    typesUsed.lower = true;
                } else if (charSet.digits.includes(char)) {
                    typesUsed.digits = true;
                } else {
                    typesUsed.specials = true;
                }
            },
            getRandomChar: function(charSetStr, decimalValue) {
                return charSetStr[decimalValue % charSetStr.length];
            }
        };

        // ==================== 密码生成器 ====================
        async function generateHMACSHA256Password(password, key) {
            const enc = new TextEncoder();
            const keyBuf = enc.encode(key);
            const passwordBuf = enc.encode(password);

            const cryptoKey = await window.crypto.subtle.importKey(
                'raw',
                keyBuf,
                { name: 'HMAC', hash: 'SHA-256' },
                false,
                ['sign']
            );

            const signature = await window.crypto.subtle.sign('HMAC', cryptoKey, passwordBuf);
            const signatureHex = Array.from(new Uint8Array(signature))
                .map(b => ('00' + b.toString(16)).slice(-2))
                .join('');

            const charSet = CONFIG.charSet;
            const alphabet = charSet.upper + charSet.lower;
            const allChars = charSet.upper + charSet.lower + charSet.digits + charSet.specials;

            let result = [];
            let typesUsed = { upper: false, lower: false, digits: false, specials: false };

            for (let i = 0; i < signatureHex.length; i += 4) {
                const hexChunk = signatureHex.slice(i, i + 4);
                const decimalValue = parseInt(hexChunk, 16);
                
                if(i == 0) {
                    const char = Utils.getRandomChar(alphabet, decimalValue);
                    result.push(char);
                    Utils.recordCharType(char, charSet, typesUsed);
                    continue;
                }

                const index = decimalValue % allChars.length;
                let char;
                
                if (i / 4 >= 12) {
                    if (!typesUsed.upper) {
                        char = Utils.getRandomChar(charSet.upper, decimalValue);
                    } else if (!typesUsed.lower) {
                        char = Utils.getRandomChar(charSet.lower, decimalValue);
                    } else if (!typesUsed.digits) {
                        char = Utils.getRandomChar(charSet.digits, decimalValue);
                    } else if (!typesUsed.specials) {
                        char = Utils.getRandomChar(charSet.specials, decimalValue);
                    } else {
                        char = allChars[index];
                    }
                } else {
                    char = allChars[index];
                }
                
                result.push(char);
                Utils.recordCharType(char, charSet, typesUsed);
            }
            return result.join('');
        }

        // ==================== 显示密码控制器 ====================
        const showPasswordController = {
            getIcon: function() {
                return DOM.showPasswordBtn.querySelector('i');
            },
            getStatus: function() {
                return this.getIcon().classList.contains('icon-open-eye');
            },
            toggleStatus: function() {
                const icon = this.getIcon();
                const isOpen = this.getStatus();
                icon.setAttribute('class', isOpen ? 'svg-icon icon-close-eye' : 'svg-icon icon-open-eye');
                updateHash();
            }
        };

        // ==================== 主题管理器 ====================
        const ThemeManager = {
            loadSavedTheme: function() {
                const savedTheme = localStorage.getItem('flowerPasswordTheme');
                if (savedTheme !== null) {
                    state.isPinkTheme = savedTheme === 'pink';
                }
            },
            saveTheme: function(isPink) {
                localStorage.setItem('flowerPasswordTheme', isPink ? 'pink' : 'blue');
            },
            applyTheme: function(theme) {
                document.body.style.backgroundColor = theme.bgColor;
                DOM.topBar.style.backgroundColor = theme.bgColor;
                
                const copyBtn = DOM.lastPassword.querySelector('.copy');
                const clearBtns = document.querySelectorAll('#clear-password, #clear-key');
                copyBtn.style.backgroundColor = theme.btnColor;
                clearBtns.forEach(btn => btn.style.backgroundColor = theme.btnColor);
                
                if (!state.themeStyleElement) {
                    state.themeStyleElement = document.createElement('style');
                    state.themeStyleElement.id = 'theme-styles';
                    document.head.appendChild(state.themeStyleElement);
                }
                
                state.themeStyleElement.innerHTML = `
                    @media (hover: hover) {
                        #last-password .copy:hover:not(.copied), #clear-password:hover, #clear-key:hover {
                            background-color: ${theme.btnHover} !important;
                        }
                    }
                    #last-password .copied {
                        background-color: ${theme.copiedColor} !important;
                    }
                    .content-box input:focus {
                        border-color: ${theme.inputFocusColor} !important;
                    }
                `;
            }
        };

        // ==================== 复制功能 ====================
        const CopyManager = {
            resetCopyButton: function() {
                if (DOM.copyButton.classList.contains('copied')) {
                    DOM.copyButton.classList.remove('copied');
                }
                if (DOM.copyButton.innerText !== '复制') {
                    DOM.copyButton.innerText = '复制';
                }
            },
            initClipboard: function() {
                const clipboard = new ClipboardJS(DOM.copyButton, {
                    text: function() {
                        return state.clipboardText;
                    }
                });

                clipboard.on('success', function(e) {
                    DOM.copyButton.classList.add('copied');
                    DOM.copyButton.innerText = '已复制';
                    e.clearSelection();
                });

                clipboard.on('error', function(err) {
                    console.error('复制失败: ', err);
                    alert('复制失败，请重试');
                });
            }
        };

        // ==================== 主逻辑 ====================
        async function updateHash() {
            const password = DOM.passwordInput.value;
            const key = DOM.keyInput.value;
            
            if (password && key) {
                const hmac = await generateHMACSHA256Password(password, key);
                state.clipboardText = hmac;
                
                if(showPasswordController.getStatus()) {
                    DOM.generatedHash.innerText = hmac;
                } else {
                    DOM.generatedHash.innerText = Utils.replaceWithAsterisks(hmac);
                }
                
                DOM.lastPassword.classList.remove('hidden');
            } else {
                DOM.lastPassword.classList.add('hidden');
            }
        }

        // ==================== 事件绑定 ====================
        function bindEvents() {
            DOM.showPasswordBtn.addEventListener('click', function() {
                showPasswordController.toggleStatus();
            });

            DOM.passwordInput.addEventListener('input', function() {
                updateHash();
                CopyManager.resetCopyButton();
            });

            DOM.keyInput.addEventListener('input', function() {
                updateHash();
                CopyManager.resetCopyButton();
            });

            // 添加Delete键清除功能
            DOM.passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Delete') {
                    DOM.passwordInput.value = '';
                    updateHash();
                    CopyManager.resetCopyButton();
                }
            });

            DOM.keyInput.addEventListener('keydown', function(e) {
                if (e.key === 'Delete') {
                    DOM.keyInput.value = '';
                    updateHash();
                    CopyManager.resetCopyButton();
                }
            });

            DOM.clearPassword.addEventListener('click', function() {
                DOM.passwordInput.value = '';
                updateHash();
            });

            DOM.clearKey.addEventListener('click', function() {
                DOM.keyInput.value = '';
                updateHash();
            });

            DOM.themeToggle.addEventListener('click', function() {
                state.isPinkTheme = !state.isPinkTheme;
                ThemeManager.applyTheme(state.isPinkTheme ? CONFIG.themes.pink : CONFIG.themes.blue);
                ThemeManager.saveTheme(state.isPinkTheme);
            });
        }

        // ==================== 初始化 ====================
        function init() {
            ThemeManager.loadSavedTheme();
            ThemeManager.applyTheme(state.isPinkTheme ? CONFIG.themes.pink : CONFIG.themes.blue);
            CopyManager.initClipboard();
            bindEvents();
        }

        // 启动应用
        init();

    </script>

</body>

</html>
